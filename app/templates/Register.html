{% extends "base.html" %}
{% block content %}
<main class="card">
  <h1>Create your account</h1>
  <p class="subtitle">Register for SupaBank</p>

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>

    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" autocomplete="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required>
    <p class="hint">At least 10 characters, with letters and numbers.</p>

    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <button type="submit">Register</button>
  </form>

  <p class="footer">Already registered? <a href="{{ url_for('login.login') }}">Log in</a></p>
</main>
{% endblock %}
