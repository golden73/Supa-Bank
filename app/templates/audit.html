{% extends "base.html" %}
{% block content %}
<main class="card">
  <h1>Audit Log</h1>
  <p class="subtitle">Recent activity (last 200 entries)</p>

  <table>
    <thead><tr><th>User ID</th><th>Action</th><th>Target</th><th>IP</th><th>Date</th></tr></thead>
    <tbody>
      {% for a in audit %}
      <tr>
        <td>{{ a['user_id'] }}</td>
        <td>{{ a['action'] }}</td>
        <td>{{ a['target'] }}</td>
        <td>{{ a['ip'] }}</td>
        <td>{{ a['created_at'] }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <p class="footer">
    <a href="{{ url_for('admin.admin_users') }}">Users</a> |
    <a href="{{ url_for('audit.alerts') }}">Alerts</a> |
    <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
  </p>
</main>
{% endblock %}
